<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#F7F5F0" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="DeepPhilosophy" />
    <link rel="icon" href="/favicon.png" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="apple-touch-icon" href="/icons/pwa-192.png" />
    <link rel="canonical" href="https://deepphilosophy.top" />

    <!-- SEO -->
    <title>DeepPhilosophy</title>
    <meta name="description" content="DeepPhilosophy 是一个哲学知识平台，收录 111 个哲学流派、737 位哲学家、402 部经典著作。从古埃及到当代，探索世界哲学谱系。" />
    <meta name="keywords" content="哲学,哲学家,哲学著作,哲学流派,西方哲学,东方哲学,世界哲学,思想史,哲学知识库" />
    <meta name="author" content="@txdsyl_" />
    <meta name="robots" content="index, follow" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://deepphilosophy.top" />
    <meta property="og:title" content="DeepPhilosophy" />
    <meta property="og:description" content="111 个哲学流派 · 737 位哲学家 · 402 部经典著作。从古埃及到当代，探索世界哲学谱系。" />
    <meta property="og:image" content="https://deepphilosophy.top/favicon.png" />
    <meta property="og:site_name" content="DeepPhilosophy" />
    <meta property="og:locale" content="zh_CN" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="DeepPhilosophy" />
    <meta name="twitter:description" content="111 个哲学流派 · 737 位哲学家 · 402 部经典著作。探索世界哲学谱系。" />
    <meta name="twitter:image" content="https://deepphilosophy.top/favicon.png" />

    <!-- JSON-LD 结构化数据 -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "DeepPhilosophy",
      "url": "https://deepphilosophy.top",
      "description": "哲学知识平台：111个哲学流派、737位哲学家、402部经典著作",
      "author": {"@type": "Person", "name": "@txdsyl_"},
      "potentialAction": {
        "@type": "SearchAction",
        "target": "https://deepphilosophy.top/books?search={search_term_string}",
        "query-input": "required name=search_term_string"
      }
    }
    </script>

    <!-- 2026-08-11: 移除 Google Fonts link — 国内网络不可达, head stylesheet 阻塞 load 事件 → tab 一直转圈; 字体回退链在 App.css -->
    <!-- 2026-08-11: 构建产物/books.json/covers.json/封面走 OSS 双轨, 提前建立连接 -->
    <link rel="preconnect" href="https://deepphilosophy.oss-cn-shanghai.aliyuncs.com" crossorigin>

    <!-- N5（audit 2026-08-18）: CSP 收紧 —— 生产部署在 Cloudflare Pages, 无后端响应头,
         meta CSP 由 vite.config.js 在「生产构建时」注入（本文件不常驻, 避免 dev 被拦:
         vite HMR WebSocket ws://localhost:5173 与用户自配 http://localhost:8000 后端会被 connect-src 拦）。
         策略与 backend/main.py 中间件同源, 修改需两处同步。script-src 无 'unsafe-inline':
         启动脚本已外置 public/config-bootstrap.js（同源 'self'）; JSON-LD 为 data block 不受 script-src 限制;
         'unsafe-eval' 从未启用, 构建产物无 eval/new Function。style-src 保留 'unsafe-inline'（React 内联样式）。 -->
  </head>
  <body>
    <div id="root"></div>
    <!-- 启动时从 config.json 加载 API 地址，写入 localStorage（优先级低于用户手动设置）
         N5（audit 2026-08-18）: 由内联改为外置 public/config-bootstrap.js（同源 'self'），
         使 script-src 可去掉 'unsafe-inline'。 -->
    <script src="/config-bootstrap.js"></script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
